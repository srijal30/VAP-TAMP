# Run the VAP-TAMP remote stack.

services:
  remote:
    image: vap-tamp:remote
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISPLAY=${DISPLAY:-}
    env_file:
      - path: ../.env
        required: false
    volumes:
      - /home/salaj/robotics/vap-tamp/data:/data:ro
      - /home/salaj/robotics/vap-tamp/outputs:/outputs:rw
      - /home/salaj/robotics/vap-tamp/VAP-TAMP:/workspace/VAP-TAMP
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

volumes:
  vap-cache:
